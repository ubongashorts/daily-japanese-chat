<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Japanese Chat</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="favicon-32.png">
<meta name="theme-color" content="#c63a2a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="日本語">
<style>
  :root{
    --bg:#faf8f5; --panel:#fff; --ink:#1c1a17; --muted:#6c665e;
    --line:#e6e0d8; --accent:#c4552f; --accent-soft:#f6e7e0;
    --ok:#2f7d52; --warn:#a8571b;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#16150f; --panel:#1e1d17; --ink:#f0ece5; --muted:#9d968b;
      --line:#2e2c24; --accent:#e5825c; --accent-soft:#33221b;
      --ok:#6fca97; --warn:#e0a45f;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    display:flex;flex-direction:column;height:100vh}
  header{padding:14px 20px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  h1{font-size:15px;margin:0;font-weight:650;letter-spacing:.2px}
  .status{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
  .dot.live{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}
  .dot.err{background:var(--accent)}
  .spacer{flex:1}
  select{font:inherit;font-size:12.5px;padding:5px 8px;border-radius:7px;
    border:1px solid var(--line);background:var(--panel);color:var(--ink)}
  button.ghost{font:inherit;font-size:12.5px;padding:5px 11px;border-radius:7px;
    border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer}
  button.ghost:hover{color:var(--ink)}
  main{flex:1;overflow-y:auto;padding:26px 20px 10px;-webkit-overflow-scrolling:touch}
  @media (max-width:560px){
    header{padding:10px 13px;gap:9px}
    h1{font-size:14px;width:100%}
    select,button.ghost{font-size:12px;padding:4px 7px}
    button.talk{width:150px;height:150px;font-size:18px}
    .ja{font-size:19px}
  }
  .wrap{max-width:640px;margin:0 auto}
  .talkbox{display:flex;flex-direction:column;align-items:center;gap:12px;padding:8px 0 26px}
  button.talk{width:118px;height:118px;border-radius:50%;border:none;cursor:pointer;
    background:var(--accent);color:#fff;font:inherit;font-size:16px;font-weight:600;
    transition:transform .12s ease, box-shadow .2s ease;
    box-shadow:0 6px 22px -8px color-mix(in srgb,var(--accent) 70%,transparent)}
  button.talk:hover{transform:translateY(-1px)}
  button.talk:active{transform:translateY(1px)}
  button.talk.on{background:var(--panel);color:var(--accent);
    border:2px solid var(--accent);animation:pulse 1.9s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 34%,transparent)}
    50%{box-shadow:0 0 0 16px transparent}}
  .hint{font-size:12.5px;color:var(--muted);text-align:center;max-width:340px}
  .turn{border-top:1px solid var(--line);padding:15px 2px}
  .who{font-size:11px;text-transform:uppercase;letter-spacing:.09em;
    color:var(--muted);margin-bottom:7px}
  .ja{font-size:20px;line-height:1.75;margin:0 0 3px}
  .ja:has(ruby){line-height:2.1}
  ruby{ruby-position:over}
  rt{font-size:.5em;color:var(--muted);font-weight:400;letter-spacing:.02em}
  button.ghost.off{opacity:.45}
  .who{display:flex;align-items:center;gap:8px}
  button.play{font:inherit;font-size:10px;line-height:1;padding:0;cursor:pointer;
    width:19px;height:19px;border-radius:50%;border:1px solid var(--line);
    background:var(--panel);color:var(--muted);flex:none}
  button.play:hover{color:var(--accent);border-color:var(--accent)}
  button.play:active{transform:translateY(1px)}
  button.play.busy{opacity:.5;animation:pulseDot 1s ease-in-out infinite}
  @keyframes pulseDot{0%,100%{opacity:.35}50%{opacity:.8}}
  .en{font-size:14px;color:var(--muted);margin:0 0 3px}
  .turn.me .ja{font-size:16px}
  .turn.me{opacity:.82}
  #logPanel[hidden]{display:none}   /* beats the display:flex below */
  #logPanel{position:fixed;inset:0;z-index:20;display:flex;align-items:center;
    justify-content:center;padding:18px;background:rgba(0,0,0,.45)}
  .logCard{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    width:min(680px,100%);max-height:82vh;display:flex;flex-direction:column;overflow:hidden}
  .logHead{display:flex;align-items:center;gap:7px;padding:11px 13px;
    border-bottom:1px solid var(--line);font-size:13px}
  #logBody{overflow-y:auto;padding:12px 14px;font-size:14px;line-height:1.6;
    -webkit-overflow-scrolling:touch}
  .logDay{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);
    margin:14px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line)}
  .logDay:first-child{margin-top:0}
  .logRow{display:flex;gap:9px;padding:3px 0}
  .logWho{flex:none;width:30px;font-size:11px;color:var(--muted);padding-top:3px}
  .logRow.me{opacity:.78}
  .err{color:var(--accent);font-size:13px;padding:12px 2px;white-space:pre-wrap}
  footer{border-top:1px solid var(--line);padding:9px 20px;font-size:11.5px;color:var(--muted)}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px}
</style>
</head>
<body>
<header>
  <h1>Daily Japanese Chat</h1>
  <div class="status"><span class="dot" id="dot"></span><span id="status">Idle</span></div>
  <span class="spacer"></span>
  <select id="model" title="If one model errors, try another">
    <option value="gemini-3.1-flash-live-preview">gemini-3.1-flash-live-preview</option>
    <option value="gemini-2.5-flash-native-audio-preview-09-2025">gemini-2.5-flash-native-audio</option>
    <option value="gemini-2.0-flash-live-001">gemini-2.0-flash-live-001</option>
  </select>
  <select id="voice" title="Voice">
    <option>Zephyr</option><option>Puck</option><option>Charon</option>
    <option>Kore</option><option>Fenrir</option><option>Aoede</option>
  </select>
  <select id="modeSel" title="What she does with what you say">
    <option value="chat">Chat</option>
    <option value="correct">Correct me</option>
  </select>
  <button id="rubyBtn" class="ghost" title="Show furigana above kanji">ふりがな</button>
  <button id="logBtn" class="ghost" title="See and save everything that was said">Log</button>
  <button id="keyBtn" class="ghost" title="Set or replace the API key stored in this browser">Key</button>
</header>

<main>
  <div class="wrap">
    <div class="talkbox">
      <button class="talk" id="talk">Talk</button>
      <p class="hint" id="hint">Click Talk, allow the microphone, then say
        <span style="white-space:nowrap">おはようございます</span>.</p>
    </div>
    <div id="log"></div>
  </div>
</main>

<div id="logPanel" hidden>
  <div class="logCard">
    <div class="logHead"><b>Log</b><span class="spacer"></span>
      <button id="logSave" class="ghost">Download</button>
      <button id="logClear" class="ghost">Clear</button>
      <button id="logClose" class="ghost">Close</button></div>
    <div id="logBody"></div>
  </div>
</div>
<footer>Your API key is stored only in this browser and is never uploaded. Tap <b>Key</b> to set or replace it.</footer>

<script>
const SYSTEM_INSTRUCTION = `You are my Japanese conversation partner. I am a beginner, roughly JLPT N5. This is a spoken voice conversation, so everything must be easy to follow by ear.

EVERY SINGLE TURN, including the very first, speak in two parts:
1. A short reply in Japanese.
2. Immediately after, the complete English translation of what you just said.
Never say Japanese without following it with the English. This applies even to a one-word greeting.

THE JAPANESE:
- One or two short sentences per turn, about 12 words at most. Everyday vocabulary and basic grammar only.
- Speak it slowly and clearly at a relaxed beginner pace, but keep the rhythm and intonation completely natural. Never chop sentences into fragments or add artificial pauses, because that distorts the pitch accent I am learning by ear. Make it easier by saying LESS.
- Always end with a simple question so I have something easy to answer.
- Talk about ordinary life: my day, food, weather, video games, animation and YouTube, sleep, plans, the weekend, Japan.

THE ENGLISH:
- Say it at a normal speaking pace as one short plain sentence. Translate the whole Japanese line every time, even words you assume I know.

OTHER RULES:
- If I speak English, that is fine and expected. Do not scold me. Reply in Japanese anyway in the same two-part way, then tell me the Japanese I could have used and what it means.
- If my Japanese has a real mistake, say the corrected version once, briefly, then carry on. Ignore small errors when my meaning got through. Never list everything I did wrong.
- If I ask about a word or grammar point, answer in plain English in two or three sentences, then go straight back to the two-part format.
- Keep every turn short. No lists, no preamble, no commentary about what you are doing.
- No drills or quizzes unless I ask. This is a relaxed conversation, not a lesson.
- My pronunciation is bad and my speech may come through garbled. Guess what I most likely meant from context and keep the conversation moving. Do not stop to analyse it.

COMMANDS I may say at any time:
"Again" - repeat your last Japanese exactly, natural rhythm, no English.
"Slower" - same words, spoken more slowly, still natural intonation.
"Shorter" - same idea, fewer words.
"Harder" - slightly longer sentences and less common vocabulary.
"Easier" - shorter and simpler.
"No English" - drop the translations until I say otherwise.
"English please" - bring the translations back.`;

const CORRECT_INSTRUCTION = `You are correcting my spoken Japanese. I am a beginner, roughly JLPT N5, saying sentences out loud. This is voice, so keep everything short and easy to follow by ear.

EVERY TURN, do exactly this and nothing else:
1. Say the closest correct Japanese to what I was trying to say. Change AS LITTLE AS POSSIBLE. Fix particles, conjugation, politeness, word order and counters. Keep my words, my vocabulary and my level. Do not make it longer, do not make it fancier, do not make it more advanced, and do not turn it into a different sentence. If what I said was already correct, simply say it back unchanged.
2. Then, in English, one short line naming what changed, for example "を should be が." If nothing needed fixing, say "That was already correct."

Then stop and wait for my next attempt. Do NOT reply to what I said, do NOT ask a question, do NOT continue a conversation, do NOT add encouragement.

MY SPEECH IS UNRELIABLE. My pronunciation is bad and words may come through garbled. Correct the GRAMMAR of the sentence I was attempting. Never invent vocabulary I did not try to say, and never replace a word just because it sounded odd. If a word is genuinely unclear, keep my word, correct everything around it, and add a short English "(unsure of one word)".

If you cannot tell what I meant at all, give your best guess and add a short English "(if you meant ...)" instead of inventing a different sentence.

If I speak English, translate it into the simple Japanese I should have said, then give the English line as usual.

Keep it under 4 lines. No romaji, no furigana, no markdown, no preamble.`;

const MODES = {
  chat:    {label:'Chat',       instruction: SYSTEM_INSTRUCTION,  status:'Listening — speak Japanese'},
  correct: {label:'Correct me', instruction: CORRECT_INSTRUCTION, status:'Listening — say a sentence to correct'}
};
let currentMode = 'chat';
try{ if(MODES[localStorage.getItem('mode')]) currentMode = localStorage.getItem('mode'); }catch{}


const IN_RATE = 16000, OUT_RATE = 24000;
// Auto-stop after this much continuous silence, so it never sits open streaming.
const IDLE_STOP_MS = 3 * 60 * 1000;
const VOICE_THRESHOLD = 0.012;   // rough speech-vs-room-noise level
let lastVoiceAt = 0, idleTimer = null;
const $ = id => document.getElementById(id);
const talkBtn = $('talk'), logEl = $('log'), statusEl = $('status'), dotEl = $('dot');

let ws=null, micCtx=null, micStream=null, micNode=null, srcNode=null;
let playCtx=null, playHead=0, running=false;
let curModel=null, curUser=null;

const JA = /[぀-ヿ㐀-䶿一-鿿ｦ-ﾟ]/;

function setStatus(text, kind){
  statusEl.textContent = text;
  dotEl.className = 'dot' + (kind ? ' '+kind : '');
}
function showError(msg){
  const d=document.createElement('div');
  d.className='err'; d.textContent=msg; logEl.prepend(d);
}
function turnEl(who,label){
  const d=document.createElement('div');
  d.className='turn '+who;
  d.innerHTML='<div class="who"></div>';
  d.firstChild.textContent=label;
  logEl.prepend(d);
  return d;
}
// Furigana runs as a SEPARATE text request after a turn finishes, so it never
// sits in front of the voice stream. The conversation never waits on it.
let rubyOn = true;
try{ rubyOn = localStorage.getItem('ruby') !== 'off'; }catch{}

function paintRubyBtn(){
  $('rubyBtn').classList.toggle('off', !rubyOn);
}
$('rubyBtn').onclick = ()=>{
  rubyOn = !rubyOn;
  try{ localStorage.setItem('ruby', rubyOn ? 'on' : 'off'); }catch{}
  paintRubyBtn();
  // repaint turns already on screen instead of only affecting future ones
  [...logEl.querySelectorAll('.turn')].forEach(t=>{
    if(t.dataset.t) render(t, t.dataset.t);
  });
};
paintRubyBtn();

// Turns "元気[げんき]です" into <ruby>元気<rt>げんき</rt></ruby>です
function bracketsToRuby(s){
  const esc = t => t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return esc(s).replace(/([一-鿿々]+)\[([ぁ-ゖー]+)\]/g,
    (_,k,r)=>'<ruby>'+k+'<rt>'+r+'</rt></ruby>');
}
const stripReadings = s => s.replace(/\[[ぁ-ゖー]+\]/g,'');
const squash = s => s.replace(/\s+/g,'');

// Ruby markup back to the bare sentence, so we can prove nothing was reworded.
function rubyToPlain(html){
  const d = document.createElement('div');
  d.innerHTML = html;
  [...d.querySelectorAll('rt,rp')].forEach(n=>n.remove());
  return d.textContent;
}
// What was actually said, with any readings already on screen taken back out.
const plainOf = p => rubyToPlain(p.innerHTML);
// Only ruby tags survive; anything else the analyser emits is thrown away.
const sanitizeRuby = h => h.replace(/<(?!\/?(?:ruby|rt|rp)>)[^>]*>/g,'');

/* ---- offline reader ---------------------------------------------------------
   A Japanese dictionary (~18 MB) is fetched once and then cached by the
   browser, after which readings are looked up locally in a millisecond or two.
   It runs in a worker because building the dictionary blocks its own thread for
   a couple of seconds and the microphone lives on the main thread. Until it is
   ready, the network path further down covers for it.                        */
const KURO = 'https://cdn.jsdelivr.net/npm/kuroshiro@1.2.0/dist/kuroshiro.min.js';
const KUROA = 'https://cdn.jsdelivr.net/npm/kuroshiro-analyzer-kuromoji@1.1.0/dist/kuroshiro-analyzer-kuromoji.min.js';
const DICT = 'https://cdn.jsdelivr.net/npm/kuromoji@0.1.2/dict/';

let rubyWorker = null, rubyReady = false, rubyJob = 0;
const rubyJobs = new Map();

function startRubyWorker(){
  const src =
    "importScripts('" + KURO + "','" + KUROA + "');\n" +
    "var K = self.Kuroshiro.default || self.Kuroshiro;\n" +
    "var A = self.KuromojiAnalyzer.default || self.KuromojiAnalyzer;\n" +
    "var k = new K();\n" +
    "k.init(new A({dictPath:'" + DICT + "'})).then(function(){\n" +
    "  self.onmessage = function(e){\n" +
    "    k.convert(e.data.text, {mode:'furigana', to:'hiragana'})\n" +
    "     .then(function(h){ postMessage({id:e.data.id, html:h}); })\n" +
    "     .catch(function(){ postMessage({id:e.data.id, html:null}); });\n" +
    "  };\n" +
    "  postMessage({ready:true});\n" +
    "}).catch(function(){ postMessage({failed:true}); });\n";
  try{
    rubyWorker = new Worker(URL.createObjectURL(new Blob([src],{type:'text/javascript'})));
  }catch{ return; }                      // no worker support: network path only
  rubyWorker.onmessage = e=>{
    const d = e.data || {};
    if(d.ready){ rubyReady = true; return; }
    if(d.failed){ rubyWorker = null; return; }
    const done = rubyJobs.get(d.id);
    if(done){ rubyJobs.delete(d.id); done(d.html); }
  };
  rubyWorker.onerror = ()=>{ rubyWorker = null; rubyReady = false; };
}
startRubyWorker();

function readLocally(text){
  if(!rubyReady || !rubyWorker) return Promise.resolve(null);
  return new Promise(done=>{
    const id = ++rubyJob;
    rubyJobs.set(id, done);
    rubyWorker.postMessage({id, text});
    setTimeout(()=>{ if(rubyJobs.delete(id)) done(null); }, 4000);
  });
}

// Readings are cached on the turn itself, so a later re-render puts them
// straight back instead of losing them.
function applyRuby(el){
  if(!rubyOn) return;
  const out = el.dataset.rubyOut;
  if(!out) return;
  const ps = [...el.querySelectorAll('.ja')];
  if(!ps.length) return;
  if(ps.map(plainOf).join('\n') !== el.dataset.rubySrc) return;
  const got = out.split('\n');
  if(got.length !== ps.length) return;
  ps.forEach((p,i)=>{ p.innerHTML = got[i]; });
}

function keepRuby(el, src, htmlLines){
  el.dataset.rubySrc = src;
  el.dataset.rubyOut = htmlLines.join('\n');
  applyRuby(el);
}

// One network attempt. Returns validated bracket lines, or null if it failed or
// the model reworded anything.
async function fetchReadings(key, src, want){
  const res = await fetch(
    'https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent',
    { method:'POST',
      headers:{'Content-Type':'application/json','X-goog-api-key':key},
      body: JSON.stringify({
        contents:[{parts:[{text:
          'Add hiragana readings to every kanji word in the text below. '+
          'Put each reading in square brackets immediately after its kanji, like 元気[げんき]. '+
          'The text may mix Japanese with an English translation. Leave the English, '+
          'the kana, the spacing and the punctuation exactly as they are, and reply '+
          'with the same number of lines you were given. '+
          'Reply with the text only, no explanation, no markdown.\n\n'+src}]}],
        generationConfig:{temperature:0, thinkingConfig:{thinkingBudget:0}}
      }) });
  if(!res.ok) return null;                       // 503s are common; caller retries
  const j = await res.json();
  const raw = j?.candidates?.[0]?.content?.parts?.[0]?.text;
  if(!raw) return null;
  let got = raw.trim().split('\n').map(t=>t.trim()).filter(Boolean);
  // a single line sometimes comes back wrapped; fold it back together
  if(got.length !== want && want === 1) got = [got.join(' ')];
  if(got.length !== want) return null;
  if(squash(stripReadings(got.join('\n'))) !== squash(src)) return null;
  return got;
}

/* ---- log --------------------------------------------------------------------
   Kept in this browser so a session survives a reload, and downloadable as a
   plain text file. Readings are stripped before storing: a paragraph carrying
   ruby reports them as part of its text.                                     */
const LOG_KEY = 'chatLog', LOG_MAX = 4000;

function readLog(){
  try{ return JSON.parse(localStorage.getItem(LOG_KEY) || '[]'); }catch{ return []; }
}
function logTurn(who, text){
  const t = (text || '').trim();
  if(!t) return;
  try{
    const log = readLog();
    log.push({t: Date.now(), m: currentMode, who, text: t});
    while(log.length > LOG_MAX) log.shift();
    localStorage.setItem(LOG_KEY, JSON.stringify(log));
  }catch{ /* full or blocked; the conversation matters more than the log */ }
}
function logTurnFrom(el, who){
  const ps = [...el.querySelectorAll('.ja,.en')];
  logTurn(who, ps.map(plainOf).join(' '));
}

const stamp = ms => new Date(ms).toLocaleString();

function logAsText(){
  return readLog().map(e =>
    stamp(e.t) + '\t' + (e.m || 'chat') + '\t' + (e.who === 'me' ? 'YOU' : 'AI ') + '\t' + e.text
  ).join('\n') + '\n';
}

function renderLog(){
  const log = readLog();
  const box = $('logBody');
  box.textContent = '';
  if(!log.length){ box.textContent = 'Nothing logged yet.'; return; }
  let day = '';
  for(const e of log){
    const d = new Date(e.t).toLocaleDateString();
    if(d !== day){
      day = d;
      const h = document.createElement('div');
      h.className = 'logDay';
      h.textContent = d;
      box.appendChild(h);
    }
    const row = document.createElement('div');
    row.className = 'logRow ' + (e.who === 'me' ? 'me' : 'ai');
    const w = document.createElement('span');
    w.className = 'logWho';
    w.textContent = e.who === 'me' ? 'You' : 'AI';
    const s = document.createElement('span');
    s.textContent = e.text;
    row.append(w, s);
    box.appendChild(row);
  }
  box.scrollTop = box.scrollHeight;
}

$('logBtn').onclick = ()=>{ renderLog(); $('logPanel').hidden = false; };
$('logClose').onclick = ()=>{ $('logPanel').hidden = true; };
$('logPanel').onclick = e =>{ if(e.target === $('logPanel')) $('logPanel').hidden = true; };
addEventListener('keydown', e =>{ if(e.key === 'Escape') $('logPanel').hidden = true; });

$('logSave').onclick = ()=>{
  const blob = new Blob([logAsText()], {type:'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'japanese-chat-log-' + new Date().toISOString().slice(0,10) + '.txt';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 8000);
};

// Two taps rather than a confirm() dialog, which would block the page.
let clearArmed = null;
$('logClear').onclick = ()=>{
  const b = $('logClear');
  if(!clearArmed){
    b.textContent = 'Tap again to delete';
    clearArmed = setTimeout(()=>{ clearArmed = null; b.textContent = 'Clear'; }, 4000);
    return;
  }
  clearTimeout(clearArmed); clearArmed = null; b.textContent = 'Clear';
  try{ localStorage.removeItem(LOG_KEY); }catch{}
  renderLog();
};


$('modeSel').value = currentMode;
$('modeSel').onchange = ()=>{
  currentMode = $('modeSel').value;
  try{ localStorage.setItem('mode', currentMode); }catch{}
  // The instruction is only sent when the socket opens, so switching mode
  // mid-session means reconnecting.
  if(running){ stop(); setStatus('Switching mode…'); setTimeout(start, 500); }
};

/* ---- replay -----------------------------------------------------------------
   Her side plays back the audio she actually sent, kept as raw PCM. Your side
   has no recording of her saying your sentence, so it is read by whatever
   Japanese voice the device itself provides — free, offline, and absent on a
   device with no Japanese voice installed, in which case the button is simply
   not offered.                                                              */
const KEEP_AUDIO_TURNS = 20;
let turnAudio = [];            // PCM for the reply currently arriving
const audioTurns = [];         // turns still holding audio, oldest first
let replayCtx = null;

function replayContext(){
  if(playCtx && playCtx.state !== 'closed') return playCtx;
  if(!replayCtx || replayCtx.state === 'closed')
    replayCtx = new (window.AudioContext || window.webkitAudioContext)({sampleRate: OUT_RATE});
  return replayCtx;
}

function addPlayButton(el, label, fn){
  const who = el.querySelector('.who');
  if(!who || who.querySelector('.play')) return;
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'play';
  b.title = label;
  b.setAttribute('aria-label', label);
  b.textContent = '▶';
  b.onclick = ()=>fn(b);
  who.appendChild(b);
}

function keepHerVoice(el){
  if(!turnAudio.length) return;
  el.__audio = turnAudio;
  turnAudio = [];
  audioTurns.push(el);
  while(audioTurns.length > KEEP_AUDIO_TURNS){        // let old audio go
    const old = audioTurns.shift();
    delete old.__audio;
    const b = old.querySelector('.play');
    if(b) b.remove();
  }
  addPlayButton(el, 'Play her voice again', ()=>{
    const ctx = replayContext();
    if(ctx.state === 'suspended') ctx.resume().catch(()=>{});
    playStored(el);
  });
}

function playStored(el){
  const chunks = el.__audio;
  if(!chunks || !chunks.length) return;
  const ctx = replayContext();
  const total = chunks.reduce((n,c)=>n+c.length, 0);
  const buf = ctx.createBuffer(1, total, OUT_RATE);
  const ch = buf.getChannelData(0);
  let at = 0;
  for(const c of chunks){
    for(let i=0;i<c.length;i++) ch[at+i] = c[i]/32768;
    at += c.length;
  }
  playBuffer(buf);
}

// The device's own Japanese voice, if it has one at all.
let jaVoice = null;
function pickJaVoice(){
  if(!('speechSynthesis' in window)) return;
  const all = speechSynthesis.getVoices().filter(v=>/^ja\b|^ja-/i.test(v.lang||''));
  if(!all.length) return;
  // Windows ships several old robotic voices that sort first by default;
  // a Natural/Neural voice beats Google's, and Google's beats those.
  const rank = v => /natural|neural|premium|enhanced/i.test(v.name||'') ? 3
                  : /google/i.test(v.name||'') ? 2 : 1;
  jaVoice = all.slice().sort((a,b)=>rank(b)-rank(a))[0];
}
if('speechSynthesis' in window){
  pickJaVoice();
  speechSynthesis.addEventListener('voiceschanged', pickJaVoice);
}

// Read only the Japanese back; a Japanese voice makes a mess of the English half.
const japaneseOnly = t =>
  t.replace(/[A-Za-z][A-Za-z'’]*(?:[\s,.!?'’-]+[A-Za-z][A-Za-z'’]*)*[.!?]?/g, ' ')
   .replace(/\s+/g, ' ').trim();

function speakJapanese(text){
  if(!jaVoice) return;
  const say = japaneseOnly(text);
  if(!say) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(say);
  u.voice = jaVoice;
  u.lang = jaVoice.lang;
  u.rate = 0.9;
  speechSynthesis.speak(u);
}

/* ---- AivisSpeech ------------------------------------------------------------
   If the engine happens to be running on this machine it reads your sentence
   in コハク, which is far better than any voice a browser can reach. It is
   absent whenever the engine is not up and on every phone, so this only ever
   runs ahead of the device voice, never instead of it.

   The probe cannot happen at page load: Chrome guards requests to the local
   network behind a permission it will only prompt for during a real click, and
   a request made without one hangs forever with no error. So the first attempt
   is made on the first press, with a short fuse.                            */
const AIVIS = 'http://127.0.0.1:10101';
const AIVIS_SPEAKER = 1878365376;          // コハク / ノーマル
let aivisOk = null;                        // null unknown, false ruled out
const aivisCache = new Map();

function playBuffer(buf){
  const ctx = replayContext();
  const src = ctx.createBufferSource();
  src.buffer = buf;
  src.connect(ctx.destination);
  src.start();
}

let warming = false;
function warmAivis(){
  if(warming) return;
  warming = true;
  fetch(AIVIS+'/audio_query?text='+encodeURIComponent('準備できたよ。')+'&speaker='+AIVIS_SPEAKER,
    {method:'POST'}).catch(()=>{}).finally(()=>{ warming = false; });
}

async function aivisSpeak(text){
  if(aivisOk === false) return false;
  const had = aivisCache.get(text);
  if(had){ playBuffer(had); return true; }
  try{
    const q = await fetch(AIVIS+'/audio_query?text='+encodeURIComponent(text)+'&speaker='+AIVIS_SPEAKER,
      {method:'POST', signal:AbortSignal.timeout(aivisOk ? 15000 : 3000)});
    if(!q.ok) throw new Error('query '+q.status);
    const res = await fetch(AIVIS+'/synthesis?speaker='+AIVIS_SPEAKER,
      {method:'POST', headers:{'Content-Type':'application/json'},
       body: JSON.stringify(await q.json()), signal: AbortSignal.timeout(25000)});
    if(!res.ok) throw new Error('synthesis '+res.status);
    const buf = await replayContext().decodeAudioData(await res.arrayBuffer());
    aivisCache.set(text, buf);
    if(aivisCache.size > 40) aivisCache.delete(aivisCache.keys().next().value);
    aivisOk = true;
    playBuffer(buf);
    return true;
  }catch(e){
    // A timeout most likely means Chrome is still asking about local network
    // access, so stay undecided and try again on the next press. Anything else
    // means the engine really is not reachable.
    if(!e || e.name !== 'TimeoutError') aivisOk = false;
    else warmAivis();          // it is probably just cold; get it ready
    return false;
  }
}

function offerSpokenBack(el){
  if(!jaVoice) return;                       // nothing could speak it at all
  const p = el.querySelector('.ja');
  if(!p || !japaneseOnly(plainOf(p))) return;
  addPlayButton(el, 'Hear this said properly', async (btn)=>{
    const q = el.querySelector('.ja');
    if(!q) return;
    const text = japaneseOnly(plainOf(q));
    if(!text) return;
    const ctx = replayContext();
    if(ctx.state === 'suspended') ctx.resume().catch(()=>{});
    btn.disabled = true;
    btn.classList.add('busy');
    try{
      if(!await aivisSpeak(text))             // コハク when she is available
        speakJapanese(text);                  // otherwise the device's own voice
    } finally {
      btn.disabled = false;
      btn.classList.remove('busy');
    }
  });
}

const escHtml = t => t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

// A run of kanji at the very end of a partial line may still be growing —
// 今 becomes 今日, 日本 becomes 日本語 — and reading it now would flash the
// wrong furigana for a moment. Hold it back until the next chunk lands.
const safePrefix = t => t.replace(/[一-鿿々]+$/,'');

// Only one pass per turn may win, so a slow result can't overwrite a newer one.
const bumpSeq = el => (el.__rubySeq = (el.__rubySeq || 0) + 1);

// Runs on every transcription chunk while she is still speaking. Local
// dictionary only — the network path is far too slow to keep up mid-sentence.
async function liveFurigana(el){
  if(!rubyOn || !rubyReady) return;
  const ps = [...el.querySelectorAll('.ja')];
  if(!ps.length) return;
  const texts = ps.map(plainOf);
  const seq = bumpSeq(el);
  const lines = await Promise.all(texts.map(async t=>{
    const head = safePrefix(t);
    if(!/[一-鿿]/.test(head)) return null;
    const h = await readLocally(head);
    if(!h) return null;
    const clean = sanitizeRuby(h);
    if(squash(rubyToPlain(clean)) !== squash(head)) return null;
    return clean + escHtml(t.slice(head.length));
  }));
  if(el.__rubySeq !== seq) return;            // a newer chunk got there first
  if(!lines.some(h=>h)) return;
  keepRuby(el, texts.join('\n'), lines.map((h,i)=> h || escHtml(texts[i])));
}

async function addFurigana(el){
  if(!rubyOn) return;
  const seq = bumpSeq(el);
  const ps = [...el.querySelectorAll('.ja')];
  const src = ps.map(plainOf).join('\n');
  if(!src.trim() || !/[一-鿿]/.test(src)) return;   // no kanji, nothing to do

  // Instant path: the local dictionary, a line at a time.
  if(rubyReady){
    const texts = ps.map(plainOf);
    const html = await Promise.all(texts.map(readLocally));
    // Stripping the readings back out must reproduce what was said.
    if(html.every(h=>h) &&
       html.every((h,i)=>squash(rubyToPlain(sanitizeRuby(h))) === squash(texts[i]))){
      if(el.__rubySeq !== seq) return;
      keepRuby(el, src, html.map(sanitizeRuby));
      return;
    }
  }

  // Fallback while the dictionary is still downloading, or if it failed.
  const key = getKey(); if(!key) return;
  for(let attempt=0; attempt<4; attempt++){
    if(attempt) await new Promise(r=>setTimeout(r, 800*attempt));
    let got = null;
    try{ got = await fetchReadings(key, src, ps.length); }
    catch{ /* offline or blocked; try again */ }
    if(got){ if(el.__rubySeq === seq) keepRuby(el, src, got.map(bracketsToRuby)); return; }
  }
}

function render(el, text){
  [...el.querySelectorAll('.ja,.en')].forEach(n=>n.remove());
  text.split('\n').forEach(line=>{
    const t=line.trim(); if(!t) return;
    const p=document.createElement('p');
    p.className = JA.test(t) ? 'ja' : 'en';
    p.textContent = t;
    el.appendChild(p);
  });
  applyRuby(el);
}

function b64ToBytes(b64){
  const bin=atob(b64), out=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i);
  return out;
}
function bytesToB64(bytes){
  let s=''; const chunk=0x8000;
  for(let i=0;i<bytes.length;i+=chunk)
    s+=String.fromCharCode.apply(null,bytes.subarray(i,i+chunk));
  return btoa(s);
}

function playPCM(b64){
  if(!playCtx) return;
  const bytes=b64ToBytes(b64);
  const pcm=new Int16Array(bytes.buffer,bytes.byteOffset,bytes.byteLength/2);
  const buf=playCtx.createBuffer(1,pcm.length,OUT_RATE);
  const ch=buf.getChannelData(0);
  for(let i=0;i<pcm.length;i++) ch[i]=pcm[i]/32768;
  const src=playCtx.createBufferSource();
  src.buffer=buf; src.connect(playCtx.destination);
  const now=playCtx.currentTime;
  if(playHead < now) playHead = now + 0.04;
  src.start(playHead);
  playHead += buf.duration;
}
function stopPlayback(){
  if(playCtx){ playCtx.close().catch(()=>{}); }
  playCtx=new AudioContext({sampleRate:OUT_RATE});
  playHead=0;
}

// Key order: this browser's saved key, then config.js (desktop convenience), then ask.
function getKey(){
  let k = null;
  try{ k = localStorage.getItem('geminiKey'); }catch{}
  if(k) return k;
  if(window.GEMINI_API_KEY && !window.GEMINI_API_KEY.includes('PASTE'))
    return window.GEMINI_API_KEY;
  return null;
}
function askForKey(){
  const k = prompt('Paste your Gemini API key.\n\nIt is stored only in this browser and never leaves your device except to call Google.');
  if(k && k.trim()){
    try{ localStorage.setItem('geminiKey', k.trim()); }catch{}
    return k.trim();
  }
  return null;
}
$('keyBtn').onclick = ()=>{
  const k = askForKey();
  if(k) setStatus('Key saved to this browser');
};

async function start(){
  if(!window.isSecureContext){
    showError('This page must be served over HTTPS (or localhost) for the microphone to work.');
    return;
  }
  let key = getKey() || askForKey();
  if(!key){ showError('No API key set. Tap "Key" in the top right to add one.'); return; }

  running=true;
  talkBtn.textContent='Stop';
  talkBtn.classList.add('on');
  setStatus('Connecting…');

  try{
    micStream=await navigator.mediaDevices.getUserMedia({
      audio:{channelCount:1,echoCancellation:true,noiseSuppression:true}});
  }catch(e){ showError('Microphone blocked: '+e.message); return stop(); }

  playCtx=new AudioContext({sampleRate:OUT_RATE}); playHead=0;

  const url='wss://generativelanguage.googleapis.com/ws/'+
    'google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key='+
    encodeURIComponent(key);
  ws=new WebSocket(url);

  ws.onopen=()=>{
    ws.send(JSON.stringify({setup:{
      model:'models/'+$('model').value,
      generationConfig:{
        responseModalities:['AUDIO'],
        speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:$('voice').value}}}
      },
      systemInstruction:{parts:[{text:MODES[currentMode].instruction}]},
      inputAudioTranscription:{},
      outputAudioTranscription:{}
    }}));
  };

  ws.onmessage=async ev=>{
    const raw = ev.data instanceof Blob ? await ev.data.text() : ev.data;
    let msg; try{ msg=JSON.parse(raw); }catch{ return; }

    if(msg.setupComplete){ setStatus(MODES[currentMode].status,'live'); openMic(); return; }

    const sc=msg.serverContent;
    if(!sc) return;

    if(sc.interrupted){ stopPlayback(); }

    if(sc.inputTranscription && sc.inputTranscription.text){
      if(!curUser) curUser=turnEl('me','You');
      curUser.dataset.t=(curUser.dataset.t||'')+sc.inputTranscription.text;
      render(curUser,curUser.dataset.t);
    }
    if(sc.outputTranscription && sc.outputTranscription.text){
      if(!curModel) curModel=turnEl('ai','Japanese Chat');
      curModel.dataset.t=(curModel.dataset.t||'')+sc.outputTranscription.text;
      render(curModel,curModel.dataset.t);
      liveFurigana(curModel);   // furigana keeps up with her voice
    }
    const parts=sc.modelTurn && sc.modelTurn.parts;
    if(parts) for(const p of parts){
      if(p.inlineData && p.inlineData.data){
        playPCM(p.inlineData.data);            // playback path, untouched
        const by = b64ToBytes(p.inlineData.data);
        turnAudio.push(new Int16Array(by.buffer, by.byteOffset, by.byteLength/2).slice());
      }
    }
    if(sc.turnComplete){
      if(curModel){ addFurigana(curModel); keepHerVoice(curModel); logTurnFrom(curModel,'ai'); }
      if(curUser){ offerSpokenBack(curUser); logTurnFrom(curUser,'me'); }
      curModel=null; curUser=null;
    }
  };

  ws.onerror=()=>showError('WebSocket error. Check the key, or try another model in the dropdown.');
  ws.onclose=e=>{
    if(running){
      if(e.code!==1000) showError('Connection closed ('+e.code+') '+(e.reason||'')+
        '\nIf this says the model is not found or not available, pick a different model above.');
      stop();
    }
  };
}

// Mobile browsers often ignore a requested sample rate, so resample to exactly 16k.
function downsampleTo16k(input, srcRate){
  if(srcRate === IN_RATE) return input;
  const ratio = srcRate / IN_RATE;
  const outLen = Math.floor(input.length / ratio);
  const out = new Float32Array(outLen);
  for(let i=0;i<outLen;i++){
    const start = Math.floor(i*ratio), end = Math.min(Math.floor((i+1)*ratio), input.length);
    let sum = 0, n = 0;
    for(let j=start;j<end;j++){ sum += input[j]; n++; }
    out[i] = n ? sum/n : 0;
  }
  return out;
}

function openMic(){
  micCtx=new AudioContext({sampleRate:IN_RATE});
  micCtx.resume().catch(()=>{});
  const actualRate = micCtx.sampleRate;   // may not be 16000 on mobile
  srcNode=micCtx.createMediaStreamSource(micStream);
  micNode=micCtx.createScriptProcessor(4096,1,1);
  micNode.onaudioprocess=e=>{
    if(!ws || ws.readyState!==1) return;

    const raw=e.inputBuffer.getChannelData(0);
    const f=downsampleTo16k(raw, actualRate);
    const pcm=new Int16Array(f.length);
    let sum=0;
    for(let i=0;i<f.length;i++){
      const s=Math.max(-1,Math.min(1,f[i]));
      sum+=s*s;
      pcm[i]=s<0?s*0x8000:s*0x7fff;
    }
    if(Math.sqrt(sum/f.length) > VOICE_THRESHOLD) lastVoiceAt = Date.now();
    ws.send(JSON.stringify({realtimeInput:{audio:{
      mimeType:'audio/pcm;rate='+IN_RATE,
      data:bytesToB64(new Uint8Array(pcm.buffer))
    }}}));
  };
  srcNode.connect(micNode);
  micNode.connect(micCtx.destination);

  lastVoiceAt = Date.now();
  clearInterval(idleTimer);
  idleTimer = setInterval(()=>{
    if(!running) return;
    const quiet = Date.now() - lastVoiceAt;
    if(quiet > IDLE_STOP_MS){
      stop();
      setStatus('Stopped — no speech for 3 minutes');
      return;
    }
    const left = Math.ceil((IDLE_STOP_MS - quiet)/60000);
    setStatus(quiet > 45000
      ? 'Listening — auto-stops in ~'+left+' min if quiet'
      : 'Listening — speak Japanese', 'live');
  }, 5000);
}

function stop(){
  running=false;
  clearInterval(idleTimer); idleTimer=null;
  talkBtn.textContent='Talk';
  talkBtn.classList.remove('on');
  setStatus('Idle');
  try{ micNode&&micNode.disconnect(); srcNode&&srcNode.disconnect(); }catch{}
  if(micCtx){ micCtx.close().catch(()=>{}); micCtx=null; }
  if(micStream){ micStream.getTracks().forEach(t=>t.stop()); micStream=null; }
  if(playCtx){ playCtx.close().catch(()=>{}); playCtx=null; }
  if(ws){ const s=ws; ws=null; try{ s.close(); }catch{} }
  curModel=null; curUser=null;
}

talkBtn.onclick=()=> running ? stop() : start();

// Release the mic and socket if the tab is closed or reloaded.
window.addEventListener('pagehide', ()=>{ if(running) stop(); });
</script>
</body>
</html>
